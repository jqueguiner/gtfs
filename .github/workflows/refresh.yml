name: refresh-catalog
on:
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday 04:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Pull Mobility Database
        env:
          MDB_REFRESH_TOKEN: ${{ secrets.MDB_REFRESH_TOKEN }}
        run: python3 scripts/ingest_mdb.py
      - name: Scrape France (transport.data.gouv.fr)
        run: python3 scripts/scrape_france.py || true
      - name: Rebuild tree + coverage table
        run: python3 scripts/build_repo.py
      - name: Commit if changed
        run: |
          git config user.name "gtfs-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: weekly catalog refresh"
          git push
